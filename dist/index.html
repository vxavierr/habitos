<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hábitos" />
    <meta name="application-name" content="Hábitos" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="Rastreador simples de hábitos diários, feito para iPod touch." />
    <title>Hábitos</title>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="fatal" class="fatal" hidden></div>
    <div id="app" class="app">
      <header class="top">
        <h1 id="title">Hoje</h1>
        <p id="subtitle"></p>
        <p id="save-state" class="save-state" aria-live="polite"></p>
        <span id="offline-badge" class="offline-badge" hidden></span>
      </header>
      <main id="main" class="main"></main>
      <nav class="tabs" aria-label="Seções">
        <button type="button" data-tab="hoje" class="is-active">Hoje</button>
        <button type="button" data-tab="historico">Histórico</button>
        <button type="button" data-tab="ajustes">Ajustes</button>
      </nav>
    </div>
    <script src="js/compat.js"></script>
    <script src="js/date.js"></script>
    <script src="js/id.js"></script>
    <script src="js/queue.js"></script>
    <script src="js/model.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
